name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # dist/index.mjs is committed and is what both install channels execute.
      # A rebuild must produce no diff, or the shipped bundle is stale.
      - run: npm run build
      - name: dist/ is in sync with src/
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error file=dist/index.mjs::dist/ is stale. Run 'npm run build' and commit dist/"
            exit 1
          fi

      # src/index.js imports the version from package.json (inlined at build). The other 3 are hand-edited.
      - name: versions agree
        run: node -p "const v = ['package.json', 'manifest.json', '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json'].map((f) => { const j = require('./' + f); return f + ' ' + (j.version ?? j.plugins[0].version); }); if (new Set(v.map((s) => s.split(' ')[1])).size > 1) { console.error('::error::versions disagree'); process.exitCode = 1; } v.join('\\n')"

      # Live selftest: the Fontsource API and jsdelivr are public with no bot-blocking, so this is safe on runners.
      - run: npm run selftest
